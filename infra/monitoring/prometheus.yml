global:
  scrape_interval: 15s
scrape_configs:
  - job_name: gateway
    static_configs: [{targets: ["gateway:9100"]}]
  - job_name: console
    metrics_path: /metrics
    authorization:
      credentials_file: /tmp/metrics_token
    static_configs: [{targets: ["web:8081"]}]
  - job_name: eval-reporter   # reports "down" unless the reporting profile is running
    static_configs: [{targets: ["eval-reporter:9200"]}]
