name: gateway
on:
  push: {paths: ["gateway/**", ".github/workflows/gateway.yml"]}
  pull_request: {paths: ["gateway/**", ".github/workflows/gateway.yml"]}
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: gateway}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: gateway/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
