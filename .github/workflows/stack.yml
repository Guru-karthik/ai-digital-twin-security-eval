name: stack
# Builds the whole Compose stack and runs infra/smoke.sh against it.
on:
  push: {paths: ["console-php/**", "gateway/**", "infra/**", "docker-compose.yml", ".github/workflows/stack.yml"]}
  pull_request: {paths: ["console-php/**", "gateway/**", "infra/**", "docker-compose.yml", ".github/workflows/stack.yml"]}
permissions: {contents: read}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: ./infra/gen-env.sh
      - run: docker compose up -d --build
      - run: ./infra/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
      - if: always()
        run: docker compose down -v
  terraform:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: infra/terraform}}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: "1.12.2"}
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate
