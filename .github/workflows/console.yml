name: console
on:
  push: {paths: ["console-php/**", ".github/workflows/console.yml"]}
  pull_request: {paths: ["console-php/**", ".github/workflows/console.yml"]}
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: console-php}}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: "8.4", extensions: "pdo_sqlite, mbstring", coverage: none}
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
