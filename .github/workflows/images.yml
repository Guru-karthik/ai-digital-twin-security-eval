name: images
# Scans every image with Trivy. Pushes to GHCR only from main in the repository that owns the registry namespace.
on:
  push: {branches: [main], paths: ["console-php/**", "gateway/**", "infra/twin-stub/**", "twin/**", "eval-reporter/**", ".github/workflows/images.yml"]}
  pull_request: {paths: ["console-php/**", "gateway/**", "infra/twin-stub/**", "twin/**", "eval-reporter/**", ".github/workflows/images.yml"]}
permissions: {contents: read}
jobs:
  scan-and-push:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: console-app, context: console-php, target: app}
          - {name: console-web, context: console-php, target: web}
          - {name: gateway, context: gateway, target: ""}
          - {name: twin-stub, context: infra/twin-stub, target: ""}
          - {name: twin-agent, context: twin, target: ""}
          - {name: eval-reporter, context: eval-reporter, target: ""}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          load: true
          tags: local/${{ matrix.name }}:ci
      - name: Trivy (fails on fixable HIGH/CRITICAL)
        # Same container and flags used when the images were fixed locally; avoids a third-party action's own dependencies.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.0 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 local/${{ matrix.name }}:ci
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Push to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          repo=$(echo "ghcr.io/${{ github.repository_owner }}/twin-${{ matrix.name }}" | tr '[:upper:]' '[:lower:]')
          docker tag local/${{ matrix.name }}:ci "$repo:${{ github.sha }}"
          docker tag local/${{ matrix.name }}:ci "$repo:latest"
          docker push "$repo:${{ github.sha }}" && docker push "$repo:latest"
  deploy:
    # STUB: no deployment target exists. Terraform in infra/terraform has never been applied.
    needs: scan-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy is a stub. Apply infra/terraform manually after reviewing the plan."
